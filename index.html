<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Letter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="hearts-background">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>
        
        <div class="decorative-elements">
            <div class="floating-circle circle-1"></div>
            <div class="floating-circle circle-2"></div>
            <div class="floating-circle circle-3"></div>
            <div class="floating-circle circle-4"></div>
            <div class="floating-circle circle-5"></div>
            <div class="light-beam beam-1"></div>
            <div class="light-beam beam-2"></div>
            <div class="light-beam beam-3"></div>
        </div>
        
        <div class="letter-container">
            <div class="letter-header">
                <h1>My Dearest Love</h1>
                <div class="date">December 2024</div>
            </div>
            
            <div class="letter-content">
                <div class="typing-line" id="line1"></div>
                <div class="typing-line" id="line2"></div>
                <div class="typing-line" id="line3"></div>
                <div class="typing-line" id="line4"></div>
                <div class="typing-line" id="line5"></div>
                <div class="typing-line" id="line6"></div>
                <div class="typing-line" id="line7"></div>
                <div class="typing-line" id="line8"></div>
            </div>
            
            <div class="signature">
                <div class="typing-line" id="signature"></div>
            </div>
        </div>
        
        <div class="surprise-container" id="surprise">
            <div class="surprise-content">
                <h2>A Special Message for You</h2>
                <div class="photo-frame">
                    <div class="romantic-photo">
                        <svg width="200" height="150" viewBox="0 0 200 150">
                            <rect width="200" height="150" fill="#ffb3ba" rx="10"/>
                            <circle cx="70" cy="60" r="15" fill="#ff6b9d"/>
                            <circle cx="130" cy="60" r="15" fill="#ff6b9d"/>
                            <path d="M 60 90 Q 100 110 140 90" stroke="#ff1744" stroke-width="3" fill="none"/>
                            <text x="100" y="130" text-anchor="middle" fill="#d81b60" font-size="12" font-family="serif">Our Love Story</text>
                        </svg>
                    </div>
                </div>
                <p class="surprise-message">Every moment with you is a treasure. You make my world brighter with your smile, and my heart fuller with your love. Thank you for being the most wonderful part of my life.</p>
                <div class="floating-hearts">
                    <span class="floating-heart">💖</span>
                    <span class="floating-heart">💕</span>
                    <span class="floating-heart">💗</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
