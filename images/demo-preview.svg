<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="heartGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1744;stop-opacity:0.8" />
    </radialGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
    </linearGradient>
    
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Floating circles -->
  <circle cx="120" cy="100" r="40" fill="rgba(255,255,255,0.1)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 10,-20; -5,15; 0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="150" r="60" fill="rgba(255,182,193,0.15)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; -15,25; 20,-10; 0,0" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="450" r="30" fill="rgba(173,216,230,0.2)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 25,10; -10,-20; 0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating hearts -->
  <g transform="translate(100,80)">
    <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5 C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" fill="url(#heartGradient)" opacity="0.7" transform="scale(0.8)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-15; -3,10; 0,0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(650,350)">
    <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5 C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" fill="url(#heartGradient)" opacity="0.6" transform="scale(0.6)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,12; 6,-8; 0,0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Light beams -->
  <rect x="-50" y="120" width="200" height="3" fill="rgba(255,255,255,0.3)" transform="rotate(25)" opacity="0.4">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Main card container -->
  <rect x="150" y="100" width="500" height="400" rx="20" ry="20" fill="url(#cardGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1" filter="url(#blur)" opacity="0.9"/>
  
  <!-- Card content area -->
  <rect x="170" y="120" width="460" height="360" rx="15" ry="15" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Header -->
  <text x="400" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#d81b60">My Dearest Love</text>
  <line x1="200" y1="180" x2="600" y2="180" stroke="#ff6b9d" stroke-width="2"/>
  <text x="580" y="200" text-anchor="end" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#666">December 2024</text>
  
  <!-- Letter content lines with typing effect -->
  <rect x="190" y="220" width="420" height="200" rx="10" ry="10" fill="rgba(255,255,255,0.1)" stroke="none"/>
  
  <!-- Simulated text lines -->
  <text x="210" y="245" font-family="Georgia, serif" font-size="16" fill="#2c2c2c">From the moment I met you, my world changed completely.</text>
  <text x="210" y="270" font-family="Georgia, serif" font-size="16" fill="#2c2c2c">Your smile lights up even my darkest days, and your laughter</text>
  <text x="210" y="295" font-family="Georgia, serif" font-size="16" fill="#2c2c2c">is the most beautiful melody I've ever heard.</text>
  <text x="210" y="320" font-family="Georgia, serif" font-size="16" fill="#2c2c2c">Every day with you feels like a new adventure, filled with</text>
  <text x="210" y="345" font-family="Georgia, serif" font-size="16" fill="#2c2c2c">love, joy, and countless precious moments.</text>
  <text x="210" y="370" font-family="Georgia, serif" font-size="16" fill="#2c2c2c">You are not just my partner, but my best friend...</text>
  
  <!-- Typing cursor -->
  <rect x="485" y="360" width="2" height="18" fill="#ff6b9d">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Signature -->
  <text x="580" y="460" text-anchor="end" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#d81b60">Forever yours, with all my love ❤️</text>
  
  <!-- Sparkle effects -->
  <g opacity="0.8">
    <text x="300" y="250" font-size="12" fill="gold">✨</text>
    <text x="500" y="180" font-size="10" fill="gold">✨</text>
    <text x="250" y="400" font-size="14" fill="gold">✨</text>
    <animateTransform attributeName="transform" type="rotate" values="0 400 300; 360 400 300" dur="20s" repeatCount="indefinite"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="200" cy="150" r="1" fill="white" opacity="0.8">
    <animate attributeName="cy" values="150;130;150" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="200" r="1.5" fill="rgba(255,182,193,0.8)" opacity="0.6">
    <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="450" r="1" fill="white" opacity="0.9">
    <animate attributeName="cy" values="450;430;450" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Title overlay -->
  <rect x="0" y="520" width="800" height="80" fill="rgba(0,0,0,0.7)"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">💌 Carta Romántica Interactiva</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffb3ba">Efecto de escritura línea por línea con animaciones de corazones</text>
</svg>